name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release-check

      - name: Pack release tarball
        id: pack
        run: |
          npm pack --json > pack.json
          tarball="$(node -p "JSON.parse(require('node:fs').readFileSync('pack.json', 'utf8'))[0].filename")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@v6
        with:
          name: npm-package
          path: package

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish with npm trusted publishing
        if: ${{ env.NPM_TOKEN_PRESENT == 'false' }}
        run: |
          tarball="$(find package -type f -name '*.tgz' -print -quit)"
          test -n "$tarball" || { find package -maxdepth 3 -type f -print; exit 1; }
          tarball="$(realpath "$tarball")"
          npm publish "$tarball" --access public

      - name: Publish with temporary token and provenance
        if: ${{ env.NPM_TOKEN_PRESENT == 'true' }}
        run: |
          tarball="$(find package -type f -name '*.tgz' -print -quit)"
          test -n "$tarball" || { find package -maxdepth 3 -type f -print; exit 1; }
          tarball="$(realpath "$tarball")"
          npm publish "$tarball" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
